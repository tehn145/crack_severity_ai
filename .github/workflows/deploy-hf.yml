name: Deploy → Hugging Face Spaces

# Deploy app demo lên HF Spaces sau khi CI pass trên main.
# Cần secret HF_TOKEN (write quyền) trong repo Settings → Secrets.
# Weight model upload riêng 1 lần lên Model Repo (xem DEVOPS.md).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # chỉ deploy khi CI before đó thành công (không chạy khi CI fail)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài huggingface_hub
        run: pip install -q huggingface_hub

      - name: Chuẩn bị thư mục Space (app + Dockerfile + README metadata)
        run: |
          mkdir -p dist
          cp -r app dist/app
          cp Dockerfile dist/Dockerfile
          cat > dist/README.md <<'EOF'
          ---
          title: Crack Severity AI
          emoji: 🏗️
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          # Crack Severity AI — Phase 1 Demo

          Hệ thống hỗ trợ kiểm định vết nứt bề mặt công trình (khóa luận tốt nghiệp).

          - **Phase 1**: YOLOv8s-seg phát hiện + đo đặc trưng vết nứt (chiều dài/bề rộng/diện tích/góc).
          - **Phase 2** (đang phát triển): phân loại mức độ nghiêm trọng theo ACI 224R-01 / TCVN 9381:2012.

          Quy trình: nhập thông tin công trình → tải/chụp ảnh → phát hiện tự động → lưu hồ sơ → xuất báo cáo kiểm định.
          EOF
          echo "dist/:" && ls dist

      - name: Upload lên HF Space (tự rebuild & deploy)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=os.environ["SPACE_ID"], repo_type="space",
                          space_sdk="docker", private=True, exist_ok=True)
          api.upload_folder(
              folder_path="dist",
              repo_id=os.environ["SPACE_ID"],
              repo_type="space",
              commit_message="Deploy from GitHub @ " + os.environ["GITHUB_SHA"][:7],
          )
          print("Space URL: https://huggingface.co/spaces/" + os.environ["SPACE_ID"])
          EOF
        env:
          SPACE_ID: ${{ vars.HF_SPACE_ID || 'tehn145/crack-severity-ai' }}
          GITHUB_SHA: ${{ github.sha }}
