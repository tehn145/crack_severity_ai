name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependencies (nhẹ — model lazy-load)
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app scripts/evaluate_phase1.py tests

      - name: Pytest (unit + API smoke; test cần weight tự skip)
        run: pytest tests -v --tb=short

      - name: Đóng gói được (import app không lỗi)
        run: python -c "from app.main import app; print('FastAPI import OK, routes:', len(app.routes))"
